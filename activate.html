<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفعيل استقبال الطلبات</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Almarai',sans-serif;background:#0B1E3D;min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:24px;margin:0}
  .box{background:#fff;border-radius:16px;padding:40px 32px;max-width:440px;text-align:center;
       box-shadow:0 24px 60px rgba(0,0,0,.4)}
  h1{font-size:21px;color:#0B1E3D;margin:0 0 12px}
  p{color:#6B7690;font-size:14px;line-height:1.9;margin:0 0 26px}
  button{width:100%;background:#0B1E3D;color:#fff;border:none;padding:16px;border-radius:10px;
         font-family:'Almarai',sans-serif;font-weight:700;font-size:15.5px;cursor:pointer}
  button:hover{background:#13294B}
  .hint{margin-top:18px;font-size:12.5px;color:#98A2B8;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <h1>تفعيل استقبال الطلبات</h1>
  <p>اضغط الزر مرة واحدة فقط. رح يوصلك إيميل تفعيل من FormSubmit على بريدك — افتحه واضغط على رابط التفعيل، وبعدها كل الطلبات بتوصلك تلقائياً.</p>

  <form action="https://formsubmit.co/moayadtayeh1987@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="تفعيل نموذج Smart Online Deals">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="اسم الشركة" value="إرسال تجريبي للتفعيل">
    <input type="hidden" name="البريد الإلكتروني" value="test@example.com">
    <input type="hidden" name="رقم الجوال" value="0500000000">
    <input type="hidden" name="عدد الموظفين" value="1 – 10">
    <button type="submit">إرسال طلب التفعيل</button>
  </form>

  <div class="hint">بعد التفعيل، فوت على النموذج الأساسي وجرّب إرسال طلب حقيقي.</div>
</div>
</body>
</html>
