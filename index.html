<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Online Deals — طلب خدمة</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Almarai',sans-serif;background:#0B1E3D;min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:24px;margin:0}
  .box{background:#fff;border-radius:16px;padding:40px 32px;max-width:440px;width:100%;text-align:center;
       box-shadow:0 24px 60px rgba(0,0,0,.4)}
  h1{font-size:21px;color:#0B1E3D;margin:0 0 8px}
  .sub{color:#6B7690;font-size:14px;line-height:1.9;margin:0 0 26px}
  label{display:block;text-align:right;font-size:13.5px;font-weight:700;color:#0B1E3D;margin:0 0 6px}
  input,select{width:100%;box-sizing:border-box;border:1.5px solid #DDE3EE;border-radius:10px;
       padding:13px 14px;font-family:'Almarai',sans-serif;font-size:14.5px;color:#0B1E3D;
       background:#fff;margin-bottom:18px}
  input:focus,select:focus{outline:none;border-color:#0B1E3D}
  button{width:100%;background:#0B1E3D;color:#fff;border:none;padding:16px;border-radius:10px;
         font-family:'Almarai',sans-serif;font-weight:700;font-size:15.5px;cursor:pointer;margin-top:4px}
  button:hover{background:#13294B}
</style>
</head>
<body>
<div class="box">
  <h1>Smart Online Deals</h1>
  <p class="sub">عبّي البيانات وبنتواصل معك في أقرب وقت.</p>

  <form action="https://formsubmit.co/moayadtayeh1987@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="طلب جديد – Smart Online Deals">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="text" name="_honey" style="display:none">
    <input type="hidden" name="_next" value="https://raw.githack.com/Moayadaltayah/Fleet/claude/enable-request-reception-8k4gvg/thanks.html">

    <label for="company">اسم الشركة</label>
    <input id="company" type="text" name="اسم الشركة" required>

    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" name="البريد الإلكتروني" required>

    <label for="phone">رقم الجوال</label>
    <input id="phone" type="tel" name="رقم الجوال" inputmode="tel" required>

    <label for="employees">عدد الموظفين</label>
    <select id="employees" name="عدد الموظفين" required>
      <option value="1 – 10">1 – 10</option>
      <option value="11 – 50">11 – 50</option>
      <option value="51 – 200">51 – 200</option>
      <option value="أكثر من 200">أكثر من 200</option>
    </select>

    <button type="submit">إرسال الطلب</button>
  </form>
</div>
</body>
</html>
